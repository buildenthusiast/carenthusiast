name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/carenthusiast-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: carenthusiast-1.0.${{ github.run_number }}
          path: out/*.apk

      # Издание се прави само от main и само с постоянния ключ, иначе обновяването на телефона няма да мине.
      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Car Enthusiast 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: out/*.apk

      - name: No signing key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::Няма секрет KEYSTORE_BASE64, затова не е направено издание. Виж README."
